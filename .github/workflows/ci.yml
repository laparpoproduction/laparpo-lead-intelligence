name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COMPANY_DUPLICATE_CONFIRMATION_SECRET: ci-only-company-confirmation-secret-2026
      CONTACT_DUPLICATE_CONFIRMATION_SECRET: ci-only-contact-confirmation-secret-2026
      LEAD_DUPLICATE_CONFIRMATION_SECRET: ci-only-lead-confirmation-secret-2026
      MUTATION_AUDIT_CORRELATION_SECRET: ci-only-mutation-audit-correlation-secret-2026
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-publishable-key
          LAPARPO_DEMO_MODE: "false"
      - name: Verify browser bundles exclude server-only E2E and provider secrets
        run: node scripts/authenticated-e2e/check-browser-bundle.mjs
      - name: Validate migrations and RLS
        run: |
          psql -f supabase/tests/bootstrap.sql
          psql -f supabase/migrations/202607110001_sprint_1_core_schema.sql
          psql -f supabase/migrations/202607110002_align_foundation_schema.sql
          psql -f supabase/migrations/202607110003_crm_companies_foundation.sql
          psql -f supabase/migrations/202607110004_companies_soft_delete.sql
          psql -f supabase/migrations/202607110005_companies_rls_and_duplicate_candidates.sql
          psql -f supabase/migrations/202607110006_company_mutation_idempotency.sql
          psql -f supabase/migrations/202607110007_contacts_foundation.sql
          psql -f supabase/migrations/202607110008_contacts_duplicate_candidates.sql
          psql -f supabase/migrations/202607110009_contact_mutation_idempotency.sql
          psql -f supabase/tests/leads_legacy_fixture.sql
          psql -f supabase/migrations/202607140010_leads_foundation.sql
          psql -f supabase/migrations/202607140011_lead_mutation_idempotency.sql
          psql -f supabase/migrations/202607240012_lead_activities_foundation.sql
          psql -f supabase/migrations/202607240013_lead_activity_opportunity_integrity.sql
          psql -f supabase/tests/lead_conversion_legacy_fixture.sql
          psql -f supabase/migrations/202607250014_expand_opportunity_services.sql
          psql -f supabase/migrations/202607250015_lead_opportunity_conversion.sql
          psql -f supabase/migrations/202607270016_converted_lead_read_only.sql
          psql -f supabase/migrations/202607270017_restore_archived_lead.sql
          psql -f supabase/migrations/202607270018_opportunity_read_list.sql
          psql -f supabase/tests/opportunity_pipeline_legacy_fixture.sql
          psql -f supabase/migrations/202607270019_opportunity_pipeline_foundation.sql
          psql -f supabase/migrations/202607280020_profiles_privilege_hardening.sql
          psql -f supabase/migrations/202607280021_company_hard_delete_protection.sql
          psql -f supabase/migrations/202607280022_immutable_creation_audit_metadata.sql
          psql -f supabase/migrations/202607290023_mutation_audit_correlation.sql
          psql \
            --set=correlation_secret="$MUTATION_AUDIT_CORRELATION_SECRET" \
            <<'SQL'
          insert into mutation_audit_private.mutation_correlation_secret (
            singleton,
            secret
          ) values (
            true,
            :'correlation_secret'
          );
          SQL
          psql \
            --set=correlation_secret="$MUTATION_AUDIT_CORRELATION_SECRET" \
            -f supabase/tests/mutation_audit_correlation_smoke.sql
          psql -f supabase/tests/audit_metadata_catalog_smoke.sql
          psql -f supabase/tests/rls_smoke.sql
          psql -f supabase/tests/profiles_privilege_smoke.sql
          psql -f supabase/tests/companies_smoke.sql
          psql -f supabase/tests/contacts_smoke.sql
          psql -f supabase/tests/contact_actions_smoke.sql
          psql -f supabase/tests/leads_smoke.sql
          psql -f supabase/tests/lead_actions_smoke.sql
          psql -f supabase/tests/lead_activities_smoke.sql
          psql -f supabase/tests/lead_opportunity_conversion_smoke.sql
          psql -f supabase/tests/lead_restore_smoke.sql
          psql -f supabase/tests/opportunity_read_list_smoke.sql
          psql -f supabase/tests/opportunity_pipeline_smoke.sql
          psql -f supabase/tests/company_hard_delete_smoke.sql
          psql -f supabase/tests/immutable_creation_audit_metadata_smoke.sql
          bash supabase/tests/opportunity_pipeline_concurrency.sh
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LAPARPO_AUTHENTICATED_E2E: "true"
      LAPARPO_E2E_AI_STUB: "true"
      MUTATION_AUDIT_CORRELATION_SECRET: ci-only-authenticated-e2e-correlation-secret-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify pinned Supabase CLI
        run: npx --yes supabase@2.39.2 --version
      - name: Start disposable Supabase and provision Auth fixtures
        run: bash scripts/authenticated-e2e/start-local-supabase.sh
      - name: Install authenticated Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run authenticated database-backed browser journey
        run: npm run test:e2e:authenticated
      - name: Stop disposable Supabase
        if: always()
        run: npx --yes supabase@2.39.2 stop --no-backup --workdir .
